*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0c0d2b;overflow:hidden;font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1176px;transform-origin:0 0}
#view{display:block;width:1920px;height:1080px;border:0;background:#f9fafb}
#bar{height:96px;background:#0c0d2b;display:flex;align-items:center;gap:26px;padding:0 28px;position:relative}
#bar.ring{outline:3px solid #fe5545;outline-offset:-3px;box-shadow:inset 0 0 0 6px rgba(254,85,69,.25);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 6px rgba(254,85,69,.25)}50%{box-shadow:inset 0 0 0 10px rgba(254,85,69,.10)}}
.lbl{flex:none;width:200px}.lbl b{display:block;font-size:20px;color:#c9ccff}.lbl span{font-size:16px;color:#9fa3e8}

#oppwrap .opportunity-view__tab:focus-visible{outline:3px solid #fe5545;outline-offset:1px}
.sim-item{position:relative;cursor:pointer;outline:2px dashed #b9bdf5;outline-offset:6px;border-radius:12px;transition:background .12s}
.sim-item::after{content:&quot;&quot;;position:absolute;right:10px;bottom:10px;width:26px;height:26px;opacity:.85;z-index:3;pointer-events:none;background:url(&quot;data:image/svg+xml;utf8,&lt;svg xmlns=&#x27;http://www.w3.org/2000/svg&#x27; viewBox=&#x27;0 0 24 24&#x27; fill=&#x27;none&#x27; stroke=&#x27;%238a5cf6&#x27; stroke-width=&#x27;2&#x27; stroke-linecap=&#x27;round&#x27; stroke-linejoin=&#x27;round&#x27;&gt;&lt;path d=&#x27;M9 9l9.5 3.4-4 1.7-1.7 4z&#x27;/&gt;&lt;path d=&#x27;M9 3.4v2.2M4.4 5.3l1.5 1.5M3 10h2.2M13.6 5.3l-1.5 1.5M5.3 14.4l1.5-1.5&#x27;/&gt;&lt;/svg&gt;&quot;) center/contain no-repeat}
.sim-item:hover{background:rgba(238,238,255,.55);outline:2px solid #8a5cf6}.sim-item.sel{background:rgba(228,223,247,.45);outline:2px solid #8a5cf6}
.sim-item:focus-visible{outline:3px solid #fe5545}
.opportunity-view__tab-count{display:none}
body.review .opportunity-view__tab[data-ph=&quot;1&quot;]::before{content:&quot;&quot;;position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;background:#f59e0b}
#ring{position:absolute;pointer-events:none;border-radius:12px;outline:3px solid #fe5545;outline-offset:8px;box-shadow:0 0 0 6px rgba(254,85,69,.25);animation:pulse 1.6s ease-in-out infinite;display:none;z-index:50}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(254,85,69,.25)}50%{box-shadow:0 0 0 10px rgba(254,85,69,.10)}}
#panel{position:absolute;right:28px;top:60px;width:420px;background:#fff;border-radius:8px;border-left:6px solid var(--accent);padding:28px 30px 26px 32px;line-height:1.4;box-shadow:var(--shadow);transform-origin:top right;display:none;z-index:60}
#panel h2{margin:0 0 6px;font-size:21px;line-height:1.2;font-weight:700}#panel .ctx{margin:0 0 18px;font-size:15px;color:#5a5d78}
#panel h3{margin:0 0 10px;font-size:16px;font-weight:700}
#panel ul{margin:0 0 18px;padding-left:20px}#panel li{font-size:16px;line-height:1.55;margin-bottom:12px}#panel li:last-child{margin-bottom:0}
#panel hr{border:0;border-top:1px solid #dcdff0;margin:0 0 18px}
.prompt{display:flex;gap:10px;align-items:flex-start;background:#FFEDEA;border-radius:8px;padding:10px 14px;font-size:16px;font-weight:700;line-height:1.4}.prompt svg{flex:none;margin-top:1px}
#callout{margin-top:12px;background:#eef0ff;border-radius:8px;padding:14px 16px}#callout .n{font-size:16px;font-weight:700;margin-bottom:4px}#callout .x{font-size:15px;line-height:1.45}#callout .l{margin-top:8px;font-size:15px;font-weight:700;color:#1c1e61}
.lab{margin:16px 0 0;font-size:13px;color:#5a5d78}
#phnote{display:none;margin-top:12px;background:#fffbeb;border-left:4px solid #f59e0b;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.4;color:#78350f}body.review #phnote.on{display:block}
#nudge{display:none;margin-top:12px;background:#fff4ec;border-left:4px solid #fe5545;border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.4}
@keyframes shake{0%,100%{translate:0}25%{translate:-5px}75%{translate:5px}}#panel.shake{animation:shake .3s}
#hint{position:absolute;left:28px;bottom:26px;max-width:860px;display:none;align-items:center;gap:24px;background:#fff;border-radius:8px;border-left:6px solid var(--accent);padding:16px 20px;box-shadow:var(--shadow);z-index:70;transform-origin:bottom left}
#hint p{margin:0;font-size:22px;font-weight:700;line-height:1.3}#hint::after{content:&quot;&quot;;position:absolute;left:70px;bottom:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.btn{flex:none;white-space:nowrap;font-size:17px;font-weight:600;padding:9px 24px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}.btn:focus-visible{outline:3px solid #fe5545;outline-offset:3px}
#scrim{position:absolute;inset:0;z-index:100;background:rgba(65,70,224,.10);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}
#tc{width:1040px;background:#fff;border-radius:12px;padding:44px 56px 36px;position:relative;overflow:hidden;box-shadow:var(--shadow);transform-origin:center}
#tc::before{content:&quot;&quot;;position:absolute;left:0;top:0;right:0;height:10px;background:linear-gradient(90deg,#4146E0,#8a5cf6)}
.ipill{display:inline-flex;align-items:center;gap:8px;background:#eef0ff;color:#2b2e6b;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
#tc h2{margin:0 0 18px;font-size:46px;line-height:1.15}#tc .ben{font-size:29px;font-weight:600;line-height:1.35;color:#2b2e6b;margin:0 0 18px}
#tc h3{margin:20px 0 10px;font-size:28px}#tc ul{margin:0 0 14px;padding-left:30px}#tc li{font-size:26px;line-height:1.35;margin-bottom:12px}#tc .note{font-size:22px;color:#5a5d78;margin:0 0 6px}
#tc .row{display:flex;justify-content:flex-end;margin-top:12px}#tc .btn{font-size:21px;padding:13px 34px}
